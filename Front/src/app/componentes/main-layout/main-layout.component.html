<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid ">
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <label style="color: wheat;">
      Bienvenido {{user.usuario}}
    </label>
    <button (click)="CerrarSesion()">
      <img src="/img/salirout.png" class="imgsalir img-fluid" alt="Salir">
    </button>      
    
  

    <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-2" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">MENU <i class="bi bi-file-earmark-person-fill"(click)="Modal()"></i>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          @for (item of listMenu; track $index) {
            @if (item.listmenu.length === 0) {
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" [routerLink]="item.url" routerLinkActive="active">{{ item.nombre }}</a>
              </li>
            } @else {
              <li class="nav-item ">
                <a class="nav-link active"  role="button" [routerLink]="item.url" routerLinkActive="active" data-bs-toggle="dropdown" aria-expanded="false">
                  {{ item.nombre }}
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                  @for (subitem of item.listmenu; track $index) {
                    <li><a class="dropdown-item" [routerLink]="subitem.url">{{ subitem.nombre }}</a></li>
                  }
                </ul>
              </li>
            }
          }
        </ul>

        <form class="d-flex mt-3" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn btn-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </div>
</nav>
<div class="container mt-4">

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">{{user.rol}}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        ...
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Understood</button>
      </div>
    </div>
  </div>
</div>
  <router-outlet></router-outlet>
</div>
